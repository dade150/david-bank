[project]
name = "my-dvd-bank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dade150", email = "davidecruciata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "instructor>=1.17.0",
    "openai>=3.3.0",
    "opencode-ai>=0.1.0a36",
    "pgvector>=0.5.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
my-dvd-bank = "my_dvd_bank:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
